[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localscrub"
version = "0.1.0"
description = "Local-first PHI/PII de-identification: rule/NER cascade + local LLM. Your data never leaves your machine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vadim Albarov", email = "albarov.vadim@gmail.com" }]
keywords = [
  "phi",
  "pii",
  "deidentification",
  "de-identification",
  "hipaa",
  "redaction",
  "privacy",
  "local-llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Text Processing :: Filters",
]
dependencies = ["typer>=0.12"]

[project.urls]
Repository = "https://github.com/valbarov/localscrub"
Documentation = "https://github.com/valbarov/localscrub/blob/main/docs/quickstart.md"
Changelog = "https://github.com/valbarov/localscrub/blob/main/ROADMAP.md"

[project.scripts]
localscrub = "localscrub.cli:app"

[project.optional-dependencies]
ner = [
    "torch>=2.13.0",
    "transformers>=4.40",
]
# --ner-backend onnx: int8 ONNX export via optimum (torch/transformers still
# needed for the one-time export)
ner-onnx = [
    "torch>=2.13.0",
    "transformers>=4.40",
    "optimum[onnxruntime]>=2.0",
    "onnx>=1.21",
]

[dependency-groups]
bench = [
    "en-core-web-lg",
    "presidio-analyzer>=2.2.364",
]
dev = ["pytest>=8.0", "ruff>=0.5"]
train = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "peft>=0.20.0",
    "trl>=1.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/localscrub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
